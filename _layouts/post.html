---
layout: default
---
<article class="post">
  <header class="post-head reveal">
    {% include date-de.html date=page.date %}
    <h1>{{ page.title }}</h1>
    <span class="rule" aria-hidden="true"></span>
  </header>
  {% if page.robot %}
  {% include waving-robot.html %}
  {% endif %}
  {% if page.image %}
  <figure class="post-figure reveal">
    {% capture img_src %}{% include image-url.html src=page.image %}{% endcapture %}
    <img src="{{ img_src | strip }}" alt="{{ page.image_alt | default: '' | escape }}"{% if page.image_width %} width="{{ page.image_width }}" height="{{ page.image_height }}"{% endif %} decoding="async">
    {% if page.image_caption %}
    <figcaption>{{ page.image_caption | escape }}</figcaption>
    {% endif %}
  </figure>
  {% endif %}
  <div class="post-body reveal">
    {{ content }}
  </div>
</article>
