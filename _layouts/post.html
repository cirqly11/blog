---
layout: default
---
<article class="post">
  <header class="post-head reveal">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %b %Y" }}</time>
    <h1>{{ page.title }}</h1>
    <span class="rule" aria-hidden="true"></span>
  </header>
  {% if page.robot %}
  {% include waving-robot.html %}
  {% endif %}
  <div class="post-body reveal">
    {{ content }}
  </div>
</article>
