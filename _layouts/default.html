<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | prepend: site.baseurl }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,680;1,9..144,560&family=Outfit:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | prepend: site.baseurl }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="topbar" aria-hidden="true"></div>
  <div class="read-progress" hidden aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | prepend: site.baseurl }}">{{ site.title }}</a>
      <nav aria-label="Primary">
        <a href="{{ '/' | prepend: site.baseurl }}"{% if page.url == "/" %} aria-current="page"{% endif %}>
          <span>Home</span>
          <span class="nav-line" aria-hidden="true"></span>
        </a>
        <a href="{{ '/about/' | prepend: site.baseurl }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>
          <span>About</span>
          <span class="nav-line" aria-hidden="true"></span>
        </a>
      </nav>
    </header>
    <main id="content">
      {% unless page.url == "/" or page.layout == "post" %}
      <header class="page-head reveal">
        <h1>{{ page.title }}</h1>
        <span class="rule" aria-hidden="true"></span>
      </header>
      {% endunless %}
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>{{ site.author }}</p>
    </footer>
  </div>
  <noscript>
    <style>
      .hero-copy, .post-card, .reveal, .mark span, .rule { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
  <script type="module" src="{{ '/assets/js/site.js' | prepend: site.baseurl }}"></script>
</body>
</html>
