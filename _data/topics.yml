# A post activates a bubble when its category or tag matches one of `matches`
# (compared case-insensitively). Example:
#   categories: [smart-home]
#   tags: ["PV / Energie"]
- id: smart-home
  name: Smart Home
  icon: house
  placement: featured
  bob: "9.6s"
  delay: "-0.4s"
  lines:
    - Smart
    - Home
  matches:
    - smart-home
    - smart home
    - smarthome
