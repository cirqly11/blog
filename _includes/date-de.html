{%- assign months = "Jan.,Feb.,März,Apr.,Mai,Juni,Juli,Aug.,Sept.,Okt.,Nov.,Dez." | split: "," -%}
{%- assign month_index = include.date | date: "%m" | plus: 0 | minus: 1 -%}
<time datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: "%-d" }}. {{ months[month_index] }} {{ include.date | date: "%Y" }}</time>
